server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow receiving-team photo uploads up to 20MB. Nginx default is 1MB
    # which silently 413s any modern phone photo.
    client_max_body_size 20M;

    resolver 1.1.1.1 8.8.8.8 valid=60s ipv6=off;

    # Proxy API calls to the backend service
    location /api/ {
        proxy_pass https://server-production-c3627.up.railway.app;
        proxy_http_version 1.1;
        proxy_set_header Host server-production-c3627.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Proxy WebSocket traffic for socket.io
    location /socket.io/ {
        proxy_pass https://server-production-c3627.up.railway.app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host server-production-c3627.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_read_timeout 300s;
    }

    # Proxy uploaded files served by the backend.
    # ^~ makes this prefix win over the .jpg/.png regex block below —
    # otherwise nginx tries to serve /uploads/xxx.jpg from its own disk.
    location ^~ /uploads/ {
        proxy_pass https://server-production-c3627.up.railway.app;
        proxy_http_version 1.1;
        proxy_set_header Host server-production-c3627.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_read_timeout 60s;
    }

    # Fingerprinted Vite assets (index-XXXX.js, Products-XXXX.js, etc.)
    # Filename hash changes on every build → safe to cache forever.
    # ^~ makes this win over the more generic .js/.css regex below.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html MUST never be cached. It references chunk names by hash,
    # so a stale index → the browser tries to fetch chunks that no longer
    # exist after a deploy → 'Failed to fetch dynamically imported module'.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires 0;
    }

    # SPA fallback. Same no-cache treatment because any / navigation returns
    # index.html.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        expires 0;
        try_files $uri $uri/ /index.html;
    }

    # Legacy loose regex for non-hashed static assets bundled with the SPA
    # (favicons, manifest, /brand/*, etc). Note /assets/* and /uploads/*
    # were already peeled off above.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
