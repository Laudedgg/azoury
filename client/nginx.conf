server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 1.1.1.1 8.8.8.8 valid=60s ipv6=off;

    # Proxy API calls to the backend service
    location /api/ {
        proxy_pass https://server-production-c3627.up.railway.app;
        proxy_http_version 1.1;
        proxy_set_header Host server-production-c3627.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Proxy WebSocket traffic for socket.io
    location /socket.io/ {
        proxy_pass https://server-production-c3627.up.railway.app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host server-production-c3627.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_read_timeout 300s;
    }

    # Proxy uploaded files served by the backend
    location /uploads/ {
        proxy_pass https://server-production-c3627.up.railway.app;
        proxy_http_version 1.1;
        proxy_set_header Host server-production-c3627.up.railway.app;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
